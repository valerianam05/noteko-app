spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

admin.seed.email=${ADMIN_SEED_EMAIL:}
admin.seed.password=${ADMIN_SEED_PASSWORD:}
aws.s3.bucket=${AWS_S3_BUCKET:noteko-app-preprod-bucket}
server.port= 8081 
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=false

aws.eventBridge.bus=default
aws.eventBridge.enabled=false

aws.s3.presigned-url-duration=86400
aws.region=eu-west-3

application.security.jwt.expiration=86400000
application.security.jwt.secret-key=${JWT_SECRET:dummy-jwt-secret-for-integration-tests-1234567890}
